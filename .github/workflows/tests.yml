name: Tests

# Runs on every push and PR, in EVERY repo (no repo guard): these regression
# tests gate the run-robustness bugs (campaign_id collision, headless OOM flags)
# so they cannot silently come back. GitHub-hosted runner; the tests are
# stdlib-only, so no heavy dependency install is needed.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  pytest:
    name: pytest regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run regression tests
        working-directory: mcp
        run: python -m pytest tests/test_live_push_fixes.py -v
