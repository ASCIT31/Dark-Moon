name: Publish images to GHCR

# Mirrors the published Docker Hub images to the GitHub Container Registry (ghcr.io)
# so they show up under this repo's "Packages" and can be pulled without Docker Hub
# rate limits. This does NOT rebuild anything and does NOT touch Docker Hub — the
# exact same images that power `docker compose` are re-tagged and pushed to ghcr.

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - src: docker.io/ascit/darkmoon:latest
            name: darkmoon
          - src: docker.io/ascit/opencode-darkmoon:latest
            name: opencode-darkmoon
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull, retag and push to GHCR
        run: |
          set -euo pipefail
          SRC='${{ matrix.src }}'
          DST="ghcr.io/ascit31/${{ matrix.name }}"
          echo "Mirroring $SRC -> $DST"
          docker pull "$SRC"
          docker tag "$SRC" "$DST:latest"
          docker push "$DST:latest"
          # Also publish an immutable tag when triggered by a release
          if [ "${{ github.event_name }}" = "release" ]; then
            REF='${{ github.event.release.tag_name }}'
            docker tag "$SRC" "$DST:$REF"
            docker push "$DST:$REF"
          fi
