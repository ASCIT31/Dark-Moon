name: CLA

# Every pull request needs the Darkmoon Contributor License Agreement (CLA.md). Contributors sign once by commenting
# on their pull request; signatures are stored in this repository on the `cla-signatures` branch.
# pull_request_target: the action only reads PR metadata and comments, it never checks out or runs the PR's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'ASCIT31/Dark-Moon'
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Darkmoon CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla-v1.json'
          path-to-document: 'https://github.com/ASCIT31/Dark-Moon/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'MBK-fr,Dark-Moon-X,ASCIT31,dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the Darkmoon CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can merge it, please read the [Darkmoon Contributor License Agreement](https://github.com/ASCIT31/Dark-Moon/blob/master/CLA.md) and sign it by commenting below with the sentence that follows. If you contribute for an organisation, it also signs the [Corporate CLA](https://github.com/ASCIT31/Dark-Moon/blob/master/CLA-CORPORATE.md).'
          custom-allsigned-prcomment: 'All contributors have signed the Darkmoon CLA. Thank you.'
          lock-pullrequest-aftermerge: false
